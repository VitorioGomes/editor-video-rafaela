<!-- Estilo Motion: o fundo, um só para o vídeo inteiro. Grafite quase preto, prancheta de pontos e um brilho que passeia devagar. M: [vira roxo] (CTA). Pôr antes das cenas. -->
<style>
<!--#inclui mo-base.css-->
.mf { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(120% 80% at 50% 40%, #141417 0%, #0a0a0c 70%); }
.mf-pontos { position: absolute; inset: -40px; background-image: radial-gradient(rgba(255,255,255,.07) 1.6px, transparent 1.7px); background-size: 44px 44px; }
.mf-luz { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; left: -10px; top: 300px; background: radial-gradient(circle, color-mix(in srgb, var(--c-motion) 22%, transparent) 0%, color-mix(in srgb, var(--c-motion) 8%, transparent) 38%, color-mix(in srgb, var(--c-motion) 0%, transparent) 68%); }
.mf-luz2 { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: 200px; top: 900px; background: radial-gradient(circle, rgba(70,110,255,.12) 0%, rgba(70,110,255,0) 65%); }
.mf-roxo { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; left: -110px; top: 260px; opacity: 0; background: radial-gradient(circle, color-mix(in srgb, var(--c-motion-fim) 30%, transparent) 0%, color-mix(in srgb, var(--c-motion-fim) 10%, transparent) 40%, color-mix(in srgb, var(--c-motion-fim) 0%, transparent) 68%); }
.mf-vinheta { position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
</style>
<div class="mf" id="$IDc">
  <div class="mf-pontos" id="$IDp"></div>
  <div class="mf-luz" id="$IDl"></div>
  <div class="mf-luz2" id="$IDm"></div>
  <div class="mf-roxo" id="$IDr"></div>
  <div class="mf-vinheta"></div>
</div>
<script>
// nunca parado: a luz passeia e os pontos andam devagar o vídeo todo
tl.to("#$IDl", { x: 160, y: -220, scale: 1.15, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0);
tl.to("#$IDm", { x: -260, y: -360, duration: D, ease: "sine.inOut" }, t0);
tl.to("#$IDp", { y: 44, duration: D, ease: "none" }, t0);
if (M.length) {
  tl.to("#$IDr", { opacity: 1, duration: .5, ease: "power2.out" }, t0 + M[0] - .1);
  tl.to("#$IDl, #$IDm", { opacity: .25, duration: .5 }, t0 + M[0] - .1);
}
</script>
