<!-- Exemplo do Estilo Série Animada: o dia 3 de uma série de sobrevivência num prédio (o menino do 1405), o episódio inteiro num bloco só.
     Serve para ver como se faz: os lugares, os planos, o colo, o andar, o olho mágico, as peças da série.
     Os personagens (sa-exemplo-elenco.js) e os lugares são desta história: cada história cria os seus. -->
<style>
<!--#inclui sa-base.css-->
</style>
<div class="sa" id="$IDc"><svg id="$IDs" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg></div>
<script>
<!--#inclui sa-personagem.js-->
<!--#inclui sa-base.js-->
<!--#inclui sa-cenario.js-->
<!--#inclui sa-exemplo-elenco.js-->
(function () {
const B = Boneco, S = SA.cena(document.getElementById("$IDs"), PALAVRAS), K = Cenario.kit(S);
const { el, TINTA, W, H, clamp, lerp, suave, suave2, sai, entra, prog, chave, ruido, hash, camera, pisca, respira, andar, u, antes, arco, impacto, susto, segue, caminhada, passo } = S;
const { L, R, C } = K;

// ---------- tempo das falas ----------
const F = i => S.falas[i];
const ti = S.em, tf = S.ate; // quando a palavra começa e acaba na fala i (ou a fala inteira, sem palavra)
const tosse = (t, a, b) => (t > a && t < b ? Math.pow(Math.abs(Math.sin((t - a) * 13)), 2) : 0);

// ---------- luzes do dia 3 (a energia caiu no dia 1: só luz de janela) ----------
const DIA = '#efe6d8', PENUMBRA = '#8a8296', BANHO = '#dfe8ee', SALA = '#e9dccb';
const luzJanela = { ang: -30, recorte: '#fff1d6', forca: 0.8 };
const luzFresta = { ang: -150, recorte: '#ffe2b0', forca: 0.9 };
const luzOlho = { ang: -90, recorte: '#ffe7b8', forca: 0.5 };

// ---------- elenco ----------
// o menino sujo de fuligem: a ficha dele, com manchas escuras no rosto, no pijama e nas mãos
const netoSujo = Object.assign({}, ELENCO.neto, {
  detalhes(ctx) {
    ELENCO.neto.detalhes(ctx);
    const { el, pecas, M } = ctx, r = M.cabeca;
    const mancha = (g, pts, cor = '#2a2420', op = 0.45) => { for (const [x, y, rr] of pts) el('ellipse', { cx: x, cy: y, rx: rr, ry: rr * 0.7, fill: cor, opacity: op }, g); };
    mancha(pecas.cabeca.frente, [[r * 0.35, r * 0.35, 16], [-r * 0.2, r * 0.5, 12], [r * 0.55, -r * 0.1, 10]]);
    for (const n of ['p1', 'pF']) mancha(pecas.tronco[n].extra, [[10, -60, 26], [-20, -150, 20], [30, -190, 14]], '#1d2a1c', 0.5);
    mancha(pecas.pernaF.p1.extra, [[0, 50, 18]], '#1d2a1c', 0.5);
  }
});
// o Marcos esverdeado: pupila pequena (já virou)
const olhosZumbi = m => { for (const o of m.dados.pecas.cabeca.R.olhos || []) if (o.pupila) o.pupila.setAttribute('r', 4); };
// o menino no colo de alguém: ele entra no corpo de quem carrega, entre o braço da frente e o tronco
function noColo(quem, ficha) {
  const n = B.criar(quem.dados.corpo, ficha);
  quem.dados.corpo.insertBefore(n, quem.dados.pecas.bracoF.g1);
  return n;
}
// pose do menino no colo, de frente para o ombro de quem carrega (em medidas de quem carrega)
// no colo, de lado: o menino virado para o seu peito, sentado no seu antebraço, com os braços no seu pescoço (em medidas de quem carrega)
const poseColo = (tosseK, x = 135, y = -40) => ({ x, y, esc: 1.05, vira: -1, tronco: 4 + tosseK * 10, cabeca: 10 + tosseK * 16, bracoF: { a: -120, b: -40 }, bracoT: { a: -110, b: -50 }, pernaF: { a: -75, b: 70, pe: 10 }, pernaT: { a: -65, b: 75, pe: 10 } });
// no colo de quem está de frente (a síndica no flash do dia 2)
const poseColoFrente = (tosseK, x = 168, y = -40) => ({ x, y, esc: 1.05, vira: -1, tronco: 8 + tosseK * 8, cabeca: 6 + tosseK * 12, bracoF: { a: -118, b: -40 }, bracoT: { a: -108, b: -50 }, pernaF: { a: -78, b: 84, pe: 10 }, pernaT: { a: -68, b: 88, pe: 10 } });
// de lado: o braço da frente por baixo dele, o de trás nas costas dele
// o comprimento de um passo, em px da tela: uns 0,6 da perna
const passada = (ficha, esc) => 0.6 * (((ficha.medidas || {}).coxa || 196) + ((ficha.medidas || {}).canela || 190)) * esc * (ficha.escala || 1);
const braçosCarregando = { bracoF: { mao: [150, -30], dobra: 1, punho: 0 }, bracoT: { mao: [190, -200], dobra: 1, punho: 0 } };

// ====================== LUGARES DESTE EPISÓDIO ======================
// O corredor do 14º de dia, de lado: 1401 a 1405, a porta da escada entre o 1403 e o 1404, a janela no fim.
const CH_C = 1500, ALT_C = 1080;
function corredor(g) {
  K.fundo(g, '#3d3a3a');
  K.parede(g, { x0: -1400, x1: 4400, y0: 300, y1: 1200, cor: '#6b5f55' });
  K.rodape(g, 1210, '#4a4038', 24);
  K.chao(g, { y: CH_C, cor: '#2e2a2a', fuga: 1500, passo: 180 });
  for (let x = -400; x < 4000; x += 700) R(g, x - 50, 300, 100, 22, '#cfc8b0', { 'stroke-width': 4 }); // lâmpadas apagadas
  // a janela no fim do corredor: a única luz
  R(g, 3480, 520, 360, 640, '#d9d2c0'); el('rect', { x: 3500, y: 540, width: 320, height: 600, fill: '#cfe6f5' }, g);
  L(g, 3660, 540, 3660, 1140, TINTA, 8);
  el('ellipse', { cx: 3660, cy: 840, rx: 900, ry: 700, fill: u('brilhoQuente'), opacity: 0.35 }, g);
  const portas = {};
  [['1401', -580], ['1402', 120], ['1403', 820], ['1404', 2200], ['1405', 2900]].forEach(([n, x]) => { portas[n] = K.porta(g, { x, chao: CH_C, alt: ALT_C, numero: n, olho: true }); });
  // a porta da escada, de metal, com a placa verde; atrás dela, os degraus no escuro
  const esc = K.porta(g, { x: 1500, chao: CH_C, alt: ALT_C, cor: '#717a88', metal: true, macaneta: 'esq', placa: { nome: 'ESCADA' } });
  for (let i = 0; i < 9; i++) L(esc.vao, 1540 + i * 30, 1480 - i * 90, 1640 + i * 30, 1480 - i * 90, '#1d2a22', 5);
  el('ellipse', { cx: 1650, cy: 380, rx: 200, ry: 90, fill: '#5dff9a', opacity: 0.14 }, g);
  R(g, 1395, 1040, 56, 140, '#c9302c', { rx: 18 }); R(g, 1408, 1012, 30, 30, '#2b2b2b', { rx: 6 }); // extintor
  const atores = el('g', {}, g);
  el('rect', { x: -2000, y: -2000, width: 8000, height: 6000, fill: '#fff0d6', opacity: 0.1 }, g);
  return { portas, esc, atores };
}

// A sala do 1405, de cortina fechada: penumbra, fumaça parada, coisas no chão e a porta do banheiro com luz.
const CH_S = 1620;
function sala1405(g) {
  K.fundo(g, '#3a3340');
  K.parede(g, { x0: -800, x1: 2200, y0: -600, y1: CH_S, cor: '#4a4048', bolinhas: '#544a52' });
  K.chao(g, { y: CH_S, cor: '#3b2c26', passo: 150 });
  K.quadroParede(g, { x: 600, y: 420, w: 260, h: 200, torto: 9 });
  const jan = K.janela(g, { x: 60, y: 420, w: 440, h: 640, vista: 'dia', cortina: '#6e5a3a' });
  K.sofa(g, { x: -40, chao: CH_S, larg: 640, cor: '#5b4a6a' });
  K.mesa(g, { x: 700, chao: CH_S, larg: 300, alt: 260, tombada: -78 });
  K.bagunca(g, { x: 60, w: 900, chao: CH_S + 40, n: 7, cores: ['#c94f6d', '#e6b422', '#3a7bd5', '#e7e2f0'] });
  const ban = K.porta(g, { x: 1180, chao: CH_S, alt: 1120, cor: '#8a7a68', vaoCor: '#cfdde6' });
  el('ellipse', { cx: 1340, cy: 1100, rx: 280, ry: 600, fill: u('brilhoFrio'), opacity: 0.25 }, g);
  const atores = el('g', {}, g);
  const fum = S.fumaca(g, 9, { x: -200, y: 300, w: 1600, h: 1100, vento: 8, r: 200 }, '#6f6a72', 4);
  const penumbra = el('rect', { x: -2000, y: -2000, width: 6000, height: 6000, fill: '#0b0a12', opacity: 0.38 }, g);
  g.appendChild(jan.feixe);
  return { jan, ban, atores, fum, penumbra };
}

// O banheiro do 1405: azulejo, janela alta, o box com o vidro e o chuveiro.
const CH_B = 1560;
function banheiro(g) {
  K.fundo(g, '#9fb1bd');
  K.azulejo(g, { x: -600, y: -600, w: 2400, h: CH_B + 600, cor: '#d6e2e9', rejunte: '#9fb1bd', passo: 110 });
  K.chao(g, { y: CH_B, cor: '#7f95a3', tipo: 'liso' });
  for (let x = -600; x < 1800; x += 120) L(g, x, CH_B, x - 60, CH_B + 500, '#6f8593', 4);
  // janela alta, com luz fria de manhã
  R(g, 120, 260, 260, 170, '#d9d2c0'); el('rect', { x: 136, y: 276, width: 228, height: 138, fill: '#e8f4ff' }, g);
  el('ellipse', { cx: 250, cy: 360, rx: 420, ry: 300, fill: u('brilhoFrio'), opacity: 0.45 }, g);
  // o box: piso um pouco mais alto, a parede do fundo, o chuveiro
  R(g, 400, CH_B - 30, 640, 40, '#b8c7d1');
  const chuv = el('g', {}, g); L(chuv, 860, 200, 860, 420, '#9aa3ab', 14); R(chuv, 800, 410, 120, 30, '#c9ced6', { rx: 10 });
  const atores = el('g', {}, g);
  // o vidro do box na frente, transparente, com um reflexo
  const vidro = el('g', {}, g);
  el('rect', { x: 400, y: 330, width: 330, height: CH_B - 360, fill: '#dff3ff', opacity: 0.22, stroke: '#7d93a3', 'stroke-width': 8 }, vidro);
  el('path', { d: `M 450 420 L 520 380 M 450 520 L 600 430`, stroke: '#ffffff', 'stroke-width': 10, opacity: 0.35, 'stroke-linecap': 'round' }, vidro);
  L(g, 1040, 330, 1040, CH_B - 30, '#7d93a3', 10);
  return { atores, vidro };
}

// A sua sala de dia (1402): parede de listras, a janela com a cidade, o sofá. O mesmo lugar dos dias 1 e 2, com luz de dia.
const CH_V = 1600;
function suaSala(g) {
  K.fundo(g, '#2c3048');
  K.parede(g, { x0: -800, x1: 2000, y0: -600, y1: CH_V, cor: '#3a4060', listras: { cor: '#40466a' } });
  K.chao(g, { y: CH_V, cor: '#3b2c26', passo: 160 });
  const jan = K.janela(g, { x: 80, y: 360, w: 460, h: 600, vista: 'dia', cortina: '#7a3b3b' });
  const sofa = K.sofa(g, { x: 180, chao: CH_V, larg: 820, cor: '#4d6b6e' });
  // a porta de entrada, trancada, à direita
  const porta = K.porta(g, { x: 1180, chao: CH_V, alt: 1160, cor: '#7a4f38', olho: true });
  const atores = el('g', {}, g);
  el('rect', { x: -2000, y: -2000, width: 6000, height: 6000, fill: '#fff0d6', opacity: 0.08 }, g);
  return { jan, sofa, porta, atores };
}

// Close do braço do menino: o antebraço deitado, a mão aberta, os três riscos e a manga do pijama de dinossauro.
function braco(g) {
  K.fundo(g, '#2a2430');
  el('ellipse', { cx: 300, cy: 700, rx: 700, ry: 500, fill: u('brilhoQuente'), opacity: 0.25 }, g);
  el('rect', { x: -400, y: 1330, width: 2000, height: 1200, fill: '#4d6b6e' }, g); // o sofá, embaixo, fora de foco
  el('rect', { x: -400, y: 1320, width: 2000, height: 20, fill: '#3d5558', filter: u('desf10') }, g);
  const a = el('g', { transform: 'translate(-150 960) rotate(-8)' }, g);
  const pele = '#a8693f', peleS = '#7a4727';
  // antebraço e mão (de cima), com a sombra embaixo
  el('path', { d: 'M -300 -95 L 640 -78 Q 700 -76 730 -60 L 730 70 Q 700 84 640 84 L -300 100 Z', fill: pele, stroke: TINTA, 'stroke-width': 7, 'stroke-linejoin': 'round' }, a);
  el('path', { d: 'M -300 50 L 640 44 Q 700 46 730 60 L 730 70 Q 700 84 640 84 L -300 100 Z', fill: peleS }, a);
  const mao = el('g', { transform: 'translate(740 0)' }, a);
  el('path', { d: 'M -30 -70 Q 60 -96 120 -60 Q 150 -20 140 40 Q 120 90 40 96 Q -20 96 -30 70 Z', fill: pele, stroke: TINTA, 'stroke-width': 7, 'stroke-linejoin': 'round' }, mao);
  const dedos = [];
  for (const [y, l] of [[-56, 120], [-18, 136], [22, 128], [58, 104]]) { const d = el('g', { transform: `translate(130 ${y})` }, mao); el('rect', { x: -10, y: -18, width: l, height: 36, rx: 18, fill: pele, stroke: TINTA, 'stroke-width': 6 }, d); dedos.push(d); }
  const pol = el('g', { transform: 'translate(40 -80) rotate(-40)' }, mao); el('rect', { x: -10, y: -18, width: 110, height: 38, rx: 19, fill: pele, stroke: TINTA, 'stroke-width': 6 }, pol);
  // fuligem na pele
  for (let i = 0; i < 9; i++) el('ellipse', { cx: -200 + hash(i) * 860, cy: -60 + hash(i + 3) * 120, rx: 14 + hash(i + 7) * 20, ry: 10, fill: '#2a2420', opacity: 0.4 }, a);
  // os três riscos vermelhos: o inchaço em volta e o risco por cima
  const riscos = el('g', {}, a);
  for (const [x, y] of [[300, -60], [350, -50], [400, -40]]) {
    el('path', { d: `M ${x} ${y} Q ${x + 40} ${y + 50} ${x + 70} ${y + 112}`, fill: 'none', stroke: '#e58a7a', 'stroke-width': 24, 'stroke-linecap': 'round', opacity: 0.7 }, riscos);
    el('path', { d: `M ${x} ${y} Q ${x + 40} ${y + 50} ${x + 70} ${y + 112}`, fill: 'none', stroke: '#b3141c', 'stroke-width': 10, 'stroke-linecap': 'round' }, riscos);
  }
  // a manga do pijama: verde, com os espinhos laranja do dinossauro em cima; a borda anda (cobre ou mostra os riscos)
  const manga = el('g', {}, a);
  const corpoManga = el('path', { d: '', fill: '#58b05a', stroke: TINTA, 'stroke-width': 7, 'stroke-linejoin': 'round' }, manga);
  const sombraManga = el('path', { d: '', fill: '#3d8740' }, manga);
  const punho = el('rect', { y: -112, width: 46, height: 230, rx: 16, fill: '#3d8740', stroke: TINTA, 'stroke-width': 6 }, manga);
  const espinhos = el('path', { d: '', fill: '#f07a2a', stroke: TINTA, 'stroke-width': 5, 'stroke-linejoin': 'round' }, manga);
  // a outra mão do menino, puxando a manga
  const outra = el('g', {}, g);
  el('path', { d: 'M 0 -60 Q 70 -70 110 -30 Q 130 20 100 60 Q 50 90 0 70 Z', fill: pele, stroke: TINTA, 'stroke-width': 7 }, outra);
  for (const y of [-34, 0, 34]) el('rect', { x: 80, y: y - 16, width: 80, height: 32, rx: 16, fill: pele, stroke: TINTA, 'stroke-width': 6 }, outra);
  const ate = x => {
    corpoManga.setAttribute('d', `M -400 -120 L ${x} -112 L ${x + 6} 118 L -400 126 Z`);
    sombraManga.setAttribute('d', `M -400 70 L ${x} 66 L ${x + 6} 118 L -400 126 Z`);
    punho.setAttribute('x', x - 20);
    let d = ''; for (let k = -380; k < x - 40; k += 70) d += `M ${k} -114 L ${k + 26} -168 L ${k + 52} -113 Z `;
    espinhos.setAttribute('d', d);
  };
  return { a, dedos, riscos, outra, quadro(t, e = {}) {
    const x = e.manga ?? 150; ate(x);
    // a outra mão segue a borda da manga (em coordenadas da tela: o braço está girado -8°)
    const ang = -8 * Math.PI / 180, bx = x + 10, by = -130;
    const tx = -150 + bx * Math.cos(ang) - by * Math.sin(ang), ty = 960 + bx * Math.sin(ang) + by * Math.cos(ang);
    const [ox, oy] = arco(e.chega ?? 1, [-160, 260], [0, 0], 70); // a mão chega em arco, de baixo
    outra.setAttribute('transform', `translate(${tx - 60 + ox} ${ty - 20 + oy}) rotate(${20 + 8 * Math.sin(t * 2)})`);
    outra.setAttribute('opacity', e.puxa ?? 0);
    dedos.forEach((d, i) => d.setAttribute('transform', d.getAttribute('transform').replace(/ rotate\([^)]*\)/, '') + ` rotate(${(e.fecha ?? 0) * (30 + i * 6) + Math.sin(t * 3 + i) * 2})`));
  } };
}

// ====================== PLANOS ======================
const P = [];
const plano = o => (P.push(o), o);
const escC = K.escala(ALT_C, ELENCO.voce);

// A · gancho: o braço do menino, os três riscos; ele puxa a manga para esconder
plano({ ini: 0, fim: F(1).inicio - 0.1, montar(g) {
  const b = braco(g);
  return (t, tl) => {
    camera(g, lerp(420, 470, tl / 4), lerp(960, 990, tl / 4), lerp(1.12, 1.25, suave(tl / 4)), t, 0.4);
    const tb = ti(0, 'braco'), cobre = antes(prog(t, tb - 0.1, tf(0) + 0.4));
    b.quadro(t, { manga: lerp(170, 520, cobre), puxa: Math.min(1, prog(t, tb - 0.7, tb - 0.4)), chega: sai(prog(t, tb - 0.7, tb - 0.1)), fecha: antes(prog(t, tb + 0.1, tf(0) + 0.6)) * 0.6 });
  };
} });

// B · seis da manhã: o corredor de dia, de lado; você na porta do 1402, a escada no meio, o 1405 entreaberto no fundo
plano({ ini: F(1).inicio - 0.1, fim: F(2).inicio - 0.1, montar(g) {
  const c = corredor(g);
  const r = B.criar(c.atores, ELENCO.voce);
  return (t, tl) => {
    const k = suave(prog(t, ti(1, 'buscar'), tf(1) + 0.3));
    camera(g, lerp(560, 2000, k), lerp(1020, 980, k), lerp(0.78, 0.5, k), t, 0.4);
    c.portas['1402'].abrir(0.55); c.esc.abrir(0.1); c.portas['1405'].abrir(0.14);
    const tv = ti(1, 'buscar'), virou = t > tv, rec = prog(t, tv - 0.25, tv);
    B.posar(r, Object.assign({ x: 470, y: K.pe(ELENCO.voce, CH_C, escC), esc: escC, vira: virou ? 1 : -1, tronco: 4 + respira(t) - (virou ? 0 : 6 * rec), cabeca: virou ? 4 : 10, achata: (virou ? 0 : 0.35 * rec) + impacto(t, tv + 0.12, 0.5) }, S.parado), { olhaX: virou ? 1 : 0.6, medo: 0.5, pisca: pisca(t, 5) }, luzJanela, DIA);
  };
} });

// C · você passa colado na parede, pela porta da escada encostada; pela fresta, a escada escura
plano({ ini: F(2).inicio - 0.1, fim: F(3).inicio - 0.1, montar(g) {
  const c = corredor(g);
  const r = B.criar(c.atores, ELENCO.voce);
  return (t, tl) => {
    const d = F(3).inicio - F(2).inicio;
    const xDe = tt => chave(tt, [[F(2).inicio, 1100], [ti(2, 'encostada') - 0.2, 1500], [ti(2, 'la') + 0.6, 1780], [F(3).inicio, 2350]], k => k);
    const cw = caminhada(xDe, t, F(2).inicio - 0.1, passada(ELENCO.voce, escC)), x = cw.x;
    const naPorta = Math.max(0, 1 - Math.abs(x - 1650) / 260);
    const perto = suave(prog(t, ti(2, 'la') - 0.4, ti(2, 'la') + 0.8));
    camera(g, lerp(x, 1660, perto), lerp(1050, 1150, perto), lerp(0.85, 1.35, perto), t, 0.5);
    c.portas['1402'].abrir(0.55); c.esc.abrir(0.1 + 0.01 * Math.sin(t)); c.portas['1405'].abrir(0.14);
    B.posar(r, Object.assign({ x, y: K.pe(ELENCO.voce, CH_C - 6, escC), esc: escC, tronco: -4, cabeca: 10 - 14 * naPorta, achata: passo(cw.ph) * cw.amp }, andar(cw.ph, 0.55 * cw.amp)), { olhaX: 1, medo: 0.75 + 0.25 * naPorta, pisca: naPorta > 0.3 ? 0 : pisca(t, 5) }, luzJanela, DIA);
  };
} });

// D · o 1405: cortina fechada, fumaça parada; a tosse vem do banheiro, com luz
plano({ ini: F(3).inicio - 0.1, fim: F(4).inicio - 0.1, montar(g) {
  const s = sala1405(g);
  const esc = K.escala(1120, ELENCO.voce);
  const r = B.criar(s.atores, ELENCO.voce);
  return (t, tl) => {
    const k = suave(prog(t, ti(3, 'tosse') - 0.4, F(4).inicio));
    camera(g, lerp(520, 1150, k), lerp(1000, 1080, k), lerp(0.82, 0.95, k), t, 0.4 + tosse(t, ti(3, 'tosse'), ti(3, 'tosse') + 1.2) * 0.8);
    s.jan.quadro(t, { fechada: 1, luz: 1 });
    s.ban.abrir(0.35);
    s.fum(t, 0.55, 0.3);
    const tt_ = ti(3, 'tosse'), xDe = tt => lerp(-100, 700, sai(prog(tt, F(3).inicio, tt_))) + 180 * suave(prog(tt, tt_ + 0.6, F(4).inicio)), parado = t > tt_ && t < tt_ + 0.6;
