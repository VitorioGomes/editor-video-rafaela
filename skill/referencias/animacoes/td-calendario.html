<!-- Títulos Desenhados: o calendário de destacar e o ano grande. As folhas viram até o mês certo; um algarismo do ano
     pisca na cor de destaque e segue pulsando; no fim, a pergunta manuscrita com um logo e um "?" que balança.
     Do vídeo "ainda usando o Claude no navegador": "Em 2026, final de 2026, e você ainda está usando o Claude no navegador?".
     $R0 o ano sem o último algarismo ("202"); $R1 o último ("6"); $R2 e $R3 a pergunta em dois pedaços ("e ainda ", "no navegador").
     As folhas (JAN a DEZ) estão no HTML: mude os meses se o vídeo pedir outro intervalo.
     M: [calendário e ano, as folhas viram, o algarismo pisca, pergunta 1, pergunta 2, logo, "?"].
     Camada: x 0, y 0, largura 1080, "som": false. Fica até o fim do vídeo. Tudo abaixo de ~540 px: aqui a cabeça subiu. -->
